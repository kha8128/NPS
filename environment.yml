# NPS-LogP Conda Environment
# Create with: conda env create -f environment.yml
# Activate with: conda activate nps-logp

name: nps-logp
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Python
  - python>=3.9,<3.13
  
  # PyTorch (adjust cuda version as needed)
  - pytorch>=2.0.0
  - pytorch-cuda=12.1  # Change to 11.8 if needed, or remove for CPU-only
  
  # Core scientific
  - numpy>=1.21.0
  - scipy>=1.7.0
  - joblib>=1.1.0
  
  # Visualization
  - matplotlib>=3.5.0
  - seaborn>=0.12.0
  
  # Jupyter (optional)
  - jupyter
  - ipython
  
  # Pip dependencies (not available on conda)
  - pip
  - pip:
    - torch_geometric>=2.3.0
    - lightning>=2.0.0
    - mace-torch>=0.3.0
    - ase>=3.22.0
    - e3nn>=0.5.0
    - tqdm>=4.64.0
